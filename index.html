<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Track Group</title>

<style>
  body {
    margin: 0;
    background: #ffffff;
    font-family: Aptos, Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }

  h1 {
    margin: 30px 0 40px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.12em;
  }

  /* Page container */
  .wrapper {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 16px 60px;
  }

  /* Hero image blocks */
  .hero-block {
    position: relative;
    margin-bottom: 60px;
  }

  .hero-img {
    width: 100%;
    max-height: 650px;
    object-fit: cover;
    border-radius: 24px;
    display: block;
  }

  /* Hover zoom only on the clickable one (desktop feel) */
  .clickable:hover .hero-img {
    transform: scale(1.03);
    cursor: pointer;
    transition: transform 0.5s ease;
  }

  /* Label styling */
  .label {
    position: absolute;
    bottom: 30px;
    left: 40px;
    font-size: 40px;
    font-weight: 700;
    color: black;
    text-shadow: 0 0 10px rgba(255,255,255,0.9);
    letter-spacing: 0.02em;
  }

  /* 📱 Mobile tweaks */
  @media (max-width: 768px) {
    h1 {
      margin: 20px 0 24px;
      font-size: 20px;
      letter-spacing: 0.14em;
    }

    .wrapper {
      padding: 0 12px 40px;
    }

    .hero-block {
      margin-bottom: 32px;
    }

    .hero-img {
      border-radius: 20px;
      max-height: 420px;
    }

    .label {
      font-size: 26px;
      bottom: 16px;
      left: 18px;
      text-shadow: 0 0 6px rgba(255,255,255,0.9);
    }
  }
</style>

</head>

<body>

  <h1>FAST TRACK GROUP</h1>

  <div class="wrapper">

    <!-- Regional Malls (clickable) -->
    <a href="https://www.fastrackgroup.co.nz/regionalmalls/" class="hero-block clickable">
      <img src="hamilton-perspective.jpg" class="hero-img" alt="Regional Malls">
      <div class="label">REGIONAL MALLS</div>
    </a>

    <!-- Club 55 (not clickable) -->
    <div class="hero-block">
      <img src="ai-c55-otaki.jpg" class="hero-img" alt="Club 55">
      <div class="label">CLUB 55</div>
    </div>

  </div>

</body>
</html>
