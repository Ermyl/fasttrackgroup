<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Track Group</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffffff;
    }

    h1 {
      margin: 30px 0 20px;
      font-size: 28px;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .section {
      margin-bottom: 40px;
      position: relative;
    }

    .section img {
      width: 100%;
      max-width: 1400px;
      height: auto;
      transition: transform 0.5s ease; /* enables hover animation */
    }

    /* Hover zoom on the FIRST image ONLY */
    .clickable:hover img {
      transform: scale(1.03);
      cursor: pointer;
    }

    .label {
      position: absolute;
      bottom: 20px;
      left: 40px;
      font-size: 38px;
      font-weight: 700;
      color: black;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }
  </style>
</head>

<body>

  <h1>FAST TRACK GROUP</h1>

  <!-- Regional Malls (clickable with hover animation) -->
  <a href="https://www.fastrackgroup.co.nz/regionalmalls/" class="section clickable">
    <div style="position: relative; display: inline-block;">
      <img src="hamilton-perspective.jpg" alt="Regional Malls">
      <div class="label">REGIONAL MALLS</div>
    </div>
  </a>

  <!-- Club 55 (not clickable, no hover) -->
  <div class="section">
    <div style="position: relative; display: inline-block;">
      <img src="ai-c55-otaki.jpg" alt="Club 55">
      <div class="label">CLUB 55</div>
    </div>
  </div>

</body>
</html>
