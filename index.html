<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fast Track Group</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Aptos, Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-neutral-900">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-neutral-200">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <span class="font-semibold tracking-wide">Fast Track Group</span>
      <a href="mailto:info@i4c.co.nz"
         class="inline-flex items-center rounded-xl bg-sky-600 text-white px-3 py-1.5 text-sm shadow-sm hover:bg-sky-700">
        Contact
      </a>
    </div>
  </header>

    <!-- Sites -->
  <section id="sites" class="mx-auto max-w-6xl px-4 py-10 space-y-6">

    <!-- Regional Malls (Card) -->
    <a href="https://www.fastrackgroup.co.nz/regionalmalls/"
       class="block overflow-hidden rounded-xl shadow-md hover:shadow-lg transition">
      <div class="relative">
        <img src="./hamilton-perspective.jpg" alt="Regional Malls"
             class="w-full h-auto object-cover">
        <div class="absolute bottom-5 left-5 text-white text-4xl md:text-5xl font-extrabold drop-shadow">
          REGIONAL MALLS
        </div>
      </div>
    </a>

    <!-- Club 55 (Card) -->
    <div class="overflow-hidden rounded-xl shadow-md">
      <div class="relative">
        <img src="./ai-c55-otaki.jpg" alt="Club 55"
             class="w-full h-auto object-cover">
        <div class="absolute bottom-5 left-5 text-white text-4xl md:text-5xl font-extrabold drop-shadow">
          CLUB 55
        </div>
      </div>
    </div>

  </section>



  <!-- Footer -->
  <footer class="border-t border-neutral-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-neutral-600 flex items-center justify-between">
      <div>© 2025 Fast Track Group</div>
      <a href="mailto:info@i4c.co.nz" class="hover:text-sky-600">Contact</a>
    </div>
  </footer>

</body>
</html>
