<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fast Track Group</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Aptos, Segoe UI, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-white text-neutral-900">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-blur border-b border-neutral-200">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
      <span class="font-semibold tracking-wide">Fast Track Group</span>
      <a href="mailto:info@i4c.co.nz"
         class="inline-flex items-center rounded-xl bg-sky-600 text-white px-3 py-1.5 text-sm shadow-sm hover:bg-sky-700">
        Contact
      </a>
    </div>
  </header>

  <!-- Regional Malls -->
  <section id="regional-malls" class="relative overflow-hidden bg-neutral-950 text-white">
    <a href="https://www.fastrackgroup.co.nz/regionalmalls/" class="block relative">
      <img 
        src="./hamilton-perspective.jpg"
        alt="Regional Malls"
        class="absolute inset-0 h-full w-full object-cover" />

      <div class="absolute inset-0 bg-black/50"></div>

      <div class="relative mx-auto max-w-6xl px-4 py-20 md:py-28">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">
          REGIONAL MALLS
        </h1>
      </div>
    </a>
  </section>

  <!-- Club 55 -->
  <section id="club-55" class="relative overflow-hidden bg-neutral-950 text-white">
    <img 
      src="./ai-c55-otaki.jpg"
      alt="Club 55"
      class="absolute inset-0 h-full w-full object-cover" />

    <div class="absolute inset-0 bg-black/50"></div>

    <div class="relative mx-auto max-w-6xl px-4 py-20 md:py-28">
      <h2 class="text-3xl md:text-5xl font-extrabold tracking-tight">
        CLUB 55
      </h2>
    </div>
  </section>

  <!-- Footer -->
  <footer class="border-t border-neutral-200 bg-white">
    <div class="mx-auto max-w-6xl px-4 py-6 text-sm text-neutral-600 flex items-center justify-between">
      <div>© 2025 Fast Track Group</div>
      <a href="mailto:info@i4c.co.nz" class="hover:text-sky-600">Contact</a>
    </div>
  </footer>

</body>
</html>
